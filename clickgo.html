    }

      color: #181818;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #EFEFEA;
    }
    ::-webkit-scrollbar-thumb {
      background: #111111;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #C6FF00;
    }

    .lime-badge {
      background-color: #C6FF00;
      color: #111111;
      font-weight: 700;
    }

    .lime-btn {
      background-color: #C6FF00;
      color: #111111;
      transition: all 0.2s ease;
    }
    .lime-btn:hover {
      background-color: #B5EB00;
      transform: translateY(-1px);
    }

    .black-btn {
      background-color: #111111;
      color: #ffffff;
      transition: all 0.2s ease;
    }
    .black-btn:hover {
      background-color: #080808;
      transform: translateY(-1px);
    }

    .card-hover {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card-hover:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.08);
    }

    /* Glassmorphism details */
    .glass-header {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
    }

    .active-nav {
      border-bottom: 3px solid #C6FF00;
      font-weight: 700;
    }

    body, .glass-header, .bg-white, .bg-brand-lightBg {
      transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease;
    }

    /* ===================== DARK MODE ===================== */
    html.dark { color-scheme: dark; }
    html.dark body { background:#0d0d0d; color:#ededed; }
    html.dark .glass-header { background: rgba(20,20,20,.92); }

    /* Surfaces */
    html.dark .bg-white { background-color:#171717 !important; }
    html.dark .bg-brand-lightBg,
    html.dark .bg-gray-100,
    html.dark .hover\:bg-gray-100:hover,
    html.dark .hover\:bg-gray-50:hover,
    html.dark .hover\:bg-brand-lightBg:hover { background-color:#242424 !important; }
    html.dark .bg-white\/80 { background-color:rgba(23,23,23,.8) !important; }
    html.dark .bg-red-50 { background-color:#3b1515 !important; }
    html.dark .bg-amber-50 { background-color:#3a2a0a !important; }
    html.dark .bg-green-100 { background-color:#10301c !important; }

    /* Borders */
    html.dark .border, html.dark .border-t, html.dark .border-b,
    html.dark .border-brand-border, html.dark .border-gray-100,
    html.dark .border-red-200, html.dark .border-amber-200 { border-color:#2c2c2c !important; }
    html.dark .hover\:border-black:hover { border-color:#C6FF00 !important; }

    /* Text */
    html.dark .text-brand-black,
    html.dark .text-brand-textPrimary,
    html.dark .text-black { color:#f5f5f5 !important; }
    html.dark .text-gray-500, html.dark .text-gray-600,
    html.dark .text-brand-textSecondary { color:#a3a3a3 !important; }
    html.dark .text-gray-400 { color:#8a8a8a !important; }
    html.dark .hover\:text-black:hover { color:#fff !important; }

    /* Lime elements always keep dark text */
    html.dark .lime-btn, html.dark .lime-badge, html.dark .bg-brand-lime { color:#111 !important; }

    /* Dark buttons that would otherwise blend into the background */
    html.dark .black-btn { background:#C6FF00; color:#111; }
    html.dark .bg-brand-black.text-brand-lime { background-color:#262626; }
    html.dark .focus\:ring-brand-black:focus { --tw-ring-color:#C6FF00; }

    html.dark select option { background:#1f1f1f; color:#eee; }
    html.dark ::-webkit-scrollbar-track { background:#171717; }
    html.dark ::-webkit-scrollbar-thumb { background:#3a3a3a; }

      // Language state
      const [lang, setLang] = useState(() => localStorage.getItem('clickgo_lang') || 'uz');
      useEffect(() => { localStorage.setItem('clickgo_lang', lang); }, [lang]);

      // Theme state (light / dark)
      const [theme, setTheme] = useState(() => {
        try {
          return localStorage.getItem('clickgo_theme') ||
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        } catch (e) { return 'light'; }
      });
      useEffect(() => {
        document.documentElement.classList.toggle('dark', theme === 'dark');
        try { localStorage.setItem('clickgo_theme', theme); } catch (e) {}
      }, [theme]);
      const toggleTheme = () => setTheme(p => (p === 'dark' ? 'light' : 'dark'));

      // Cart state
      const [cart, setCart] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('clickgo_cart')) || [];
        } catch(e) { return []; }
      });
      useEffect(() => { localStorage.setItem('clickgo_cart', JSON.stringify(cart)); }, [cart]);

      // Favorites state
      const [favorites, setFavorites] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('clickgo_favorites')) || [];
        } catch(e) { return []; }
      });
      useEffect(() => { localStorage.setItem('clickgo_favorites', JSON.stringify(favorites)); }, [favorites]);

      // Orders History
      const [orders, setOrders] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('clickgo_orders')) || [
            {
              id: "CGO-98412",
              date: "2026-03-10",
              total: 15400000,
              status: "Delivered",
              items: [{ id: 101, name: "Apple iPhone 15 Pro Max 256GB", quantity: 1, price: 15400000 }]
            }
          ];
        } catch(e) { return []; }
      });
      useEffect(() => { localStorage.setItem('clickgo_orders', JSON.stringify(orders)); }, [orders]);

      // Toast notification system
      const [toast, setToast] = useState(null);
      const showToast = (message) => {
        setToast(message);
        setTimeout(() => setToast(null), 3000);
      };

      // Cart Helpers
      const addToCart = (product, quantity = 1) => {
        setCart(prev => {
          const existing = prev.find(item => item.id === product.id);
          if (existing) {
            return prev.map(item => item.id === product.id 
              ? { ...item, quantity: Math.min(item.quantity + quantity, product.stock) } 
              : item);
          }
          return [...prev, { id: product.id, quantity: Math.min(quantity, product.stock) }];
        });
        showToast(LOCALES[lang].inCart + "!");
      };

      const removeFromCart = (id) => {
        setCart(prev => prev.filter(item => item.id !== id));
      };

      const updateQuantity = (id, delta) => {
        setCart(prev => prev.map(item => {
          if(item.id === id) {
            const product = MOCK_PRODUCTS.find(p => p.id === id);
            const newQty = item.quantity + delta;
            if(newQty < 1) return item;
            if(product && newQty > product.stock) return item;
            return { ...item, quantity: newQty };
          }
          return item;
        }));
      };

      const clearCart = () => setCart([]);

      // Favorites Toggle
      const toggleFavorite = (productId) => {
        setFavorites(prev => {
          if (prev.includes(productId)) {
            return prev.filter(id => id !== productId);
          } else {
            return [...prev, productId];
          }
        });

        }}>

                    onChange={(e) => setPriceMax(e.target.value)}
                    className="bg-brand-lightBg border border-brand-border rounded-xl p-2 text-xs"
                  />
                </div>
              </div>
            </div>

            {/* Catalog Main View */}
            <div className="lg:col-span-3 space-y-4">
              {/* Toolbar */}
              <div className="bg-white p-4 rounded-2xl border border-brand-border flex flex-wrap items-center justify-between gap-4">
                <span className="text-xs font-bold text-brand-textSecondary">
                  Topilgan mahsulotlar: <strong className="text-black">{filteredProducts.length}</strong>
                </span>

                {/* Sort dropdown */}
                <div className="flex items-center gap-2">
                  <span className="text-xs font-bold text-gray-400">{t.sortBy}:</span>
                  <select 
                    value={sortBy} 
                    onChange={(e) => setSortBy(e.target.value)}
                    className="bg-brand-lightBg border border-brand-border rounded-xl px-3 py-1.5 text-xs font-bold"
                  >
                    <option value="popular">{t.sortPopularity}</option>
                    <option value="price-low">{t.sortPriceLow}</option>
                    <option value="price-high">{t.sortPriceHigh}</option>
                    <option value="newest">{t.sortNewest}</option>
                  </select>
                </div>
              </div>

              {/* Products Grid */}
              {filteredProducts.length > 0 ? (
                <div className="grid grid-cols-2 sm:grid-cols-3 gap-4">
                  {filteredProducts.map(product => (
                    <ProductCard key={product.id} product={product} navigate={navigate} />
                  ))}
                </div>
              ) : (
                <div className="bg-white p-12 text-center rounded-2xl border border-brand-border space-y-4">
                  <i data-lucide="package-x" className="w-12 h-12 text-gray-300 mx-auto"></i>
                  <p className="text-sm font-bold text-gray-500">Afsuski, filtrlarga mos keladigan mahsulot topilmadi.</p>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    };

    const ProductPage = ({ productId, navigate }) => {
      const { lang, t, addToCart, favorites, toggleFavorite } = useApp();
      const product = useMemo(() => MOCK_PRODUCTS.find(p => p.id === Number(productId)), [productId]);
      const [selectedImg, setSelectedImg] = useState('');
      const [qty, setQty] = useState(1);

      useEffect(() => {
        if (product) setSelectedImg(product.image);
      }, [product]);

      if (!product) {
        return (
          <div className="max-w-7xl mx-auto px-8 py-20 text-center space-y-4">
            <h2 className="text-xl font-bold">Mahsulot topilmadi</h2>
            <button onClick={() => navigate('/')} className="black-btn px-6 py-2 rounded-xl text-xs font-bold">
              {t.continueShopping}
            </button>
          </div>
        );
      }

      const isFav = favorites.includes(product.id);

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-8 py-8 space-y-8">
          {/* Breadcrumb */}
          <div className="flex items-center gap-2 text-xs text-brand-textSecondary font-medium">
            <a href="#/" onClick={(e) => { e.preventDefault(); navigate('/'); }} className="hover:text-black">Bosh sahifa</a>
            <span>/</span>
            <a href="#/catalog" onClick={(e) => { e.preventDefault(); navigate('/catalog'); }} className="hover:text-black">{t.catalog}</a>
            <span>/</span>
            <span className="text-black font-bold truncate max-w-xs">{product.name[lang]}</span>
          </div>

          <div className="bg-white rounded-3xl border border-brand-border p-6 lg:p-8 grid grid-cols-1 lg:grid-cols-2 gap-10">
            {/* Image Gallery */}
            <div className="space-y-4">
              <div className="h-80 sm:h-96 w-full rounded-2xl overflow-hidden bg-brand-lightBg border border-brand-border flex items-center justify-center p-4">
                <img src={selectedImg || product.image} alt="" className="max-h-full max-w-full object-contain" />
              </div>
              <div className="flex gap-3 overflow-x-auto pb-2">
                {[product.image, ...(product.gallery || [])].map((img, idx) => (
                  <button
                    key={idx}
                    onClick={() => setSelectedImg(img)}
                    className={`w-16 h-16 rounded-xl border-2 overflow-hidden flex-shrink-0 ${
                      selectedImg === img ? 'border-brand-black' : 'border-transparent'
                    }`}
                  >
                    <img src={img} alt="" className="w-full h-full object-cover" />
                  </button>
                ))}
              </div>
            </div>

            {/* Product Meta Details */}
            <div className="space-y-6">
              <div>
                <span className="text-xs font-extrabold uppercase text-gray-400 bg-gray-100 px-2.5 py-1 rounded-md">
                  {product.brand}
                </span>
                <h1 className="text-xl sm:text-2xl font-black text-brand-black mt-2 leading-snug">
                  {product.name[lang]}
                </h1>
                <div className="flex items-center gap-4 mt-3 text-xs font-bold text-gray-500">
                  <div className="flex items-center text-amber-500 gap-1">
                    <i data-lucide="star" className="w-4 h-4 fill-current"></i>
                    <span>{product.rating}</span>
                    <span className="text-gray-400">({product.reviewCount} {t.reviews})</span>
                  </div>
                  <span>•</span>
                  <span className="text-green-600 font-bold">{t.inStock}: {product.stock} dona</span>
                </div>
              </div>

              {/* Price Box */}
              <div className="bg-brand-lightBg p-4 rounded-2xl border border-brand-border space-y-1">
                {product.oldPrice && (
                  <span className="text-xs text-gray-400 line-through font-medium">
                    {formatUZS(product.oldPrice)}
                  </span>
                )}
                <div className="flex items-center gap-3">
                  <span className="text-2xl font-black text-brand-black">{formatUZS(product.price)}</span>
                  {product.discountPercentage > 0 && (
                    <span className="lime-badge text-xs px-2 py-0.5 rounded-md font-extrabold">
                      -{product.discountPercentage}%
                    </span>
                  )}
                </div>
              </div>

              {/* Quantity Selector & Action Buttons */}
              <div className="space-y-4">
                <div className="flex items-center gap-4">
                  <span className="text-xs font-bold text-gray-500 uppercase">Soni:</span>
                  <div className="flex items-center border border-brand-border rounded-xl bg-white overflow-hidden">
                    <button 
                      onClick={() => setQty(Math.max(1, qty - 1))}
                      className="px-3 py-1.5 hover:bg-gray-100 font-bold"
                    >-</button>
                    <span className="px-4 py-1.5 text-xs font-black">{qty}</span>
                    <button 
                      onClick={() => setQty(Math.min(product.stock, qty + 1))}
                      className="px-3 py-1.5 hover:bg-gray-100 font-bold"
                    >+</button>
                  </div>
                </div>

                <div className="flex items-center gap-3">
                  <button
                    onClick={() => addToCart(product, qty)}
                    className="flex-1 lime-btn py-3.5 px-6 rounded-xl font-black text-sm flex items-center justify-center gap-2 shadow-sm"
                  >
                    <i data-lucide="shopping-bag" className="w-4 h-4"></i>
                    <span>{t.addToCart}</span>
                  </button>

                  <button
                    onClick={() => toggleFavorite(product.id)}
                    className={`p-3.5 rounded-xl border border-brand-border flex items-center justify-center transition-colors ${
                      isFav ? 'bg-red-50 text-red-500 border-red-200' : 'hover:bg-gray-50'
                    }`}
                  >
                    <i data-lucide="heart" className={`w-5 h-5 ${isFav ? 'fill-current' : ''}`}></i>
                  </button>
                </div>
              </div>

              {/* Perks info */}
              <div className="border-t pt-4 space-y-2 text-xs font-medium text-gray-600">
                <div className="flex items-center gap-2">
                  <i data-lucide="shield-check" className="w-4 h-4 text-green-600"></i>
                  <span>{t.guarantee}</span>
                </div>
                <div className="flex items-center gap-2">
                  <i data-lucide="truck" className="w-4 h-4 text-brand-black"></i>
                  <span>{t.fastDelivery}</span>
                </div>
              </div>
            </div>
          </div>

          {/* Description & Specs Tabs */}
          <div className="bg-white rounded-3xl border border-brand-border p-6 lg:p-8 space-y-6">
            <h3 className="text-lg font-black text-brand-black border-b pb-3">{t.specs} & {t.description}</h3>
            <p className="text-sm text-brand-textPrimary leading-relaxed">
              {product.description[lang]}
            </p>
            {product.specs && (
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
                {Object.entries(product.specs).map(([k, v]) => (
                  <div key={k} className="flex justify-between p-3 bg-brand-lightBg rounded-xl text-xs">
                    <span className="font-bold text-gray-500">{k}</span>
                    <span className="font-extrabold text-black">{v}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    };

    const CartPage = ({ navigate }) => {
      const { lang, t, cart, removeFromCart, updateQuantity, clearCart } = useApp();

      const cartDetailed = useMemo(() => {
        return cart.map(item => {
          const product = MOCK_PRODUCTS.find(p => p.id === item.id);
          return { ...item, product };
        }).filter(item => item.product !== undefined);
      }, [cart]);

      const subtotal = useMemo(() => {
        return cartDetailed.reduce((acc, item) => acc + (item.product.price * item.quantity), 0);
      }, [cartDetailed]);

      if (cartDetailed.length === 0) {
        return (
          <div className="max-w-2xl mx-auto px-4 py-20 text-center space-y-4">
            <div className="w-20 h-20 bg-brand-lightBg rounded-full flex items-center justify-center mx-auto text-gray-400">
              <i data-lucide="shopping-bag" className="w-10 h-10"></i>
            </div>
            <h2 className="text-xl font-extrabold text-brand-black">{t.emptyCart}</h2>
            <p className="text-xs text-gray-500">{t.emptyCartSub}</p>
            <button 
              onClick={() => navigate('/catalog')}
              className="black-btn px-6 py-3 rounded-xl text-xs font-extrabold"
            >
              {t.continueShopping}
            </button>
          </div>
        );
      }

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-8 py-8 space-y-6">
          <h1 className="text-2xl font-black text-brand-black flex items-center gap-2">
            <i data-lucide="shopping-bag" className="w-6 h-6 text-brand-lime fill-brand-black"></i>
            {t.cart} ({cartDetailed.length})
          </h1>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
            {/* Cart Line Items */}
            <div className="lg:col-span-2 space-y-4">
              {cartDetailed.map(({ id, quantity, product }) => (
                <div key={id} className="bg-white p-4 rounded-2xl border border-brand-border flex gap-4 items-center">
                  <img src={product.image} alt="" className="w-20 h-20 object-cover rounded-xl bg-brand-lightBg" />
                  <div className="flex-1 min-w-0 space-y-1">
                    <h3 className="text-xs sm:text-sm font-bold text-brand-black line-clamp-1">{product.name[lang]}</h3>
                    <p className="text-xs font-black text-brand-black">{formatUZS(product.price)}</p>
                  </div>
                  <div className="flex items-center gap-3">
                    <div className="flex items-center border border-brand-border rounded-lg bg-white overflow-hidden text-xs font-bold">
                      <button onClick={() => updateQuantity(id, -1)} className="px-2.5 py-1 hover:bg-gray-100">-</button>
                      <span className="px-2">{quantity}</span>
                      <button onClick={() => updateQuantity(id, 1)} className="px-2.5 py-1 hover:bg-gray-100">+</button>
                    </div>
                    <button onClick={() => removeFromCart(id)} className="p-2 text-gray-400 hover:text-red-500">
                      <i data-lucide="trash-2" className="w-4 h-4"></i>
                    </button>
                  </div>
                </div>
              ))}
            </div>

            {/* Order Summary Box */}
            <div className="bg-white p-6 rounded-3xl border border-brand-border h-fit space-y-4">
              <h3 className="text-base font-black text-brand-black border-b pb-3">{t.orderSummary}</h3>
              <div className="space-y-2 text-xs font-bold">
                <div className="flex justify-between text-gray-500">
                  <span>{t.subtotal}</span>
                  <span className="text-black">{formatUZS(subtotal)}</span>
                </div>
                <div className="flex justify-between text-gray-500">
                  <span>{t.deliveryFee}</span>
                  <span className="text-green-600 font-extrabold">{t.free}</span>
                </div>
              </div>
              <div className="border-t pt-3 flex justify-between items-center text-sm font-black">
                <span>{t.total}</span>
                <span className="text-lg text-brand-black">{formatUZS(subtotal)}</span>
              </div>
              <button
                onClick={() => navigate('/checkout')}
                className="w-full lime-btn py-3.5 rounded-xl font-black text-xs flex items-center justify-center gap-2 shadow-sm"
              >
                <span>{t.checkout}</span>
                <i data-lucide="arrow-right" className="w-4 h-4"></i>
              </button>
            </div>
          </div>
        </div>
      );
    };

    /* Demo Checkout Component */
    const CheckoutPage = ({ navigate }) => {
      const { t, cart, clearCart, orders, setOrders } = useApp();
      const [formData, setFormData] = useState({
        fullName: '',
        phone: '+998 ',
        city: 'Toshkent',
        address: '',
        payment: 'cash'
      });
      const [isSubmitted, setIsSubmitted] = useState(false);
      const [createdOrderId, setCreatedOrderId] = useState('');

      const subtotal = useMemo(() => {
        return cart.reduce((acc, item) => {
          const product = MOCK_PRODUCTS.find(p => p.id === item.id);
          return acc + (product ? product.price * item.quantity : 0);
        }, 0);
      }, [cart]);

      const handleSubmit = (e) => {
        e.preventDefault();
        const newOrderId = `CGO-${Math.floor(10000 + Math.random() * 90000)}`;
        const newOrder = {
          id: newOrderId,
          date: new Date().toISOString().split('T')[0],
          total: subtotal,
          status: "Processing",
          items: cart.map(item => {
            const product = MOCK_PRODUCTS.find(p => p.id === item.id);
            return { id: item.id, name: product?.name['uz'] || '', quantity: item.quantity, price: product?.price || 0 };
          })
        };

        setOrders([newOrder, ...orders]);
        setCreatedOrderId(newOrderId);
        setIsSubmitted(true);
        clearCart();
      };

      if (isSubmitted) {
        return (
          <div className="max-w-md mx-auto px-4 py-16 text-center space-y-6">
            <div className="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto">
              <i data-lucide="check-circle-2" className="w-10 h-10"></i>
            </div>
            <h2 className="text-xl font-black text-brand-black">{t.orderSuccess}</h2>
            <p className="text-xs text-gray-500 font-bold">{t.orderNumber} <span className="text-black">{createdOrderId}</span></p>
            <p className="text-[11px] text-amber-600 bg-amber-50 p-3 rounded-xl border border-amber-200">{t.demoWarning}</p>
            <button 
              onClick={() => navigate('/account')}
              className="black-btn w-full py-3 rounded-xl text-xs font-black"
            >
              {t.ordersHistory}
            </button>
          </div>
        );
      }

      return (
        <div className="max-w-3xl mx-auto px-4 py-8 space-y-6">
          <h1 className="text-2xl font-black text-brand-black">{t.checkoutTitle}</h1>
          <form onSubmit={handleSubmit} className="bg-white p-6 rounded-3xl border border-brand-border space-y-4">
            <div>
              <label className="text-xs font-bold text-gray-500 block mb-1">{t.fullName}</label>
              <input 
                required 
                type="text" 
                value={formData.fullName} 
                onChange={(e) => setFormData({...formData, fullName: e.target.value})}
                className="w-full bg-brand-lightBg border rounded-xl p-2.5 text-xs font-bold"
              />
            </div>
            <div>
              <label className="text-xs font-bold text-gray-500 block mb-1">{t.phone}</label>
              <input 
                required 
                type="text" 
                value={formData.phone} 
                onChange={(e) => setFormData({...formData, phone: e.target.value})}
                className="w-full bg-brand-lightBg border rounded-xl p-2.5 text-xs font-bold"
              />
            </div>
            <div>
              <label className="text-xs font-bold text-gray-500 block mb-1">{t.address}</label>
              <input 
                required 
                type="text" 
                value={formData.address} 
                onChange={(e) => setFormData({...formData, address: e.target.value})}
                className="w-full bg-brand-lightBg border rounded-xl p-2.5 text-xs font-bold"
              />
            </div>
            <div>
              <label className="text-xs font-bold text-gray-500 block mb-1">{t.paymentMethod}</label>
              <select 
                value={formData.payment} 
                onChange={(e) => setFormData({...formData, payment: e.target.value})}
                className="w-full bg-brand-lightBg border rounded-xl p-2.5 text-xs font-bold"
              >
                <option value="cash">{t.cashOnDelivery}</option>
                <option value="card">{t.cardSimulation}</option>
              </select>
            </div>
            <div className="border-t pt-4 flex justify-between items-center">
              <span className="text-sm font-black">{t.total}: {formatUZS(subtotal)}</span>
              <button type="submit" className="lime-btn px-6 py-3 rounded-xl font-black text-xs">
                {t.placeOrder}
              </button>
            </div>
          </form>
        </div>
      );
    };

    /* Demo Account Page */
    const AccountPage = ({ navigate }) => {
      const { t, orders } = useApp();

      return (
        <div className="max-w-4xl mx-auto px-4 py-8 space-y-6">
          <h1 className="text-2xl font-black text-brand-black">{t.account}</h1>
          <div className="bg-white p-6 rounded-3xl border border-brand-border space-y-6">
            <h3 className="text-base font-black border-b pb-3">{t.ordersHistory}</h3>
            {orders.length === 0 ? (
              <p className="text-xs text-gray-400">Buyurtmalar hali mavjud emas</p>
            ) : (
              <div className="space-y-4">
                {orders.map(order => (
                  <div key={order.id} className="p-4 bg-brand-lightBg rounded-2xl border border-brand-border flex justify-between items-center text-xs">
                    <div>
                      <p className="font-extrabold text-black">{order.id}</p>
                      <p className="text-gray-400">{order.date}</p>
                    </div>
                    <div className="text-right">
                      <span className="lime-badge text-[10px] px-2 py-0.5 rounded uppercase">{order.status}</span>
                      <p className="font-black text-black mt-1">{formatUZS(order.total)}</p>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    };

    const Footer = () => {
      const { t } = useApp();
      return (
        <footer className="bg-brand-black text-white border-t border-zinc-800 py-12 px-4 sm:px-8 mt-auto">
          <div className="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-4 gap-8 text-xs">
            <div className="space-y-3">
              <span className="text-2xl font-black tracking-wider text-white">
                CLICKGO<span className="text-brand-lime">.</span>
              </span>
              <p className="text-gray-400 leading-relaxed">
                Oʻzbekistondagi eng zamonaviy va qulay online marketplace platformasi.
              </p>
            </div>
            <div>
              <h4 className="font-extrabold text-white uppercase tracking-wider mb-3">Xaridorlarga</h4>
              <ul className="space-y-2 text-gray-400 font-medium">
                <li><a href="#/catalog" className="hover:text-white">Katalog</a></li>
                <li><a href="#/cart" className="hover:text-white">Savat</a></li>
                <li><a href="#/account" className="hover:text-white">Akkount</a></li>
              </ul>
            </div>
            <div>
              <h4 className="font-extrabold text-white uppercase tracking-wider mb-3">Kompaniya</h4>
              <ul className="space-y-2 text-gray-400 font-medium">
                <li><a href="#/" className="hover:text-white">Biz haqimizda</a></li>
                <li><a href="#/" className="hover:text-white">Aloqa va qo'llab-quvvatlash</a></li>
              </ul>
            </div>
            <div>
              <h4 className="font-extrabold text-white uppercase tracking-wider mb-3">Bogʻlanish</h4>
              <p className="text-gray-400">+998 71 200-00-00</p>
              <p className="text-gray-400">Toshkent q., Amir Temur shoh ko'chasi 108</p>
            </div>
          </div>
          <div className="max-w-7xl mx-auto border-t border-zinc-800 mt-8 pt-6 text-center text-gray-500 text-[11px]">
            © 2026 ClickGo Marketplace. Barcha huquqlar himoyalangan.
          </div>
        </footer>
      );
    };

    // Toast Popup Widget
    const Toast = ({ message }) => {
      if (!message) return null;
      return (
        <div className="fixed bottom-6 right-6 z-50 bg-brand-black text-brand-lime font-bold px-4 py-3 rounded-2xl shadow-2xl flex items-center gap-2 text-xs border border-brand-lime animate-bounce">
          <i data-lucide="check-circle" className="w-4 h-4"></i>
          <span>{message}</span>
        </div>
      );
    };

    // Main App Shell with Hash Router Navigation
    const MainApp = () => {
      const [currentRoute, setCurrentRoute] = useState(() => window.location.hash || '#/');
      const { toast } = useApp();

      useEffect(() => {
        const handleHashChange = () => {
          setCurrentRoute(window.location.hash || '#/');
          window.scrollTo(0, 0);
        };
        window.addEventListener('hashchange', handleHashChange);
        return () => window.removeEventListener('hashchange', handleHashChange);
      }, []);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      const navigate = (path) => {
        window.location.hash = '#' + path;
      };

      // Simple Route Switcher
      const renderRoute = () => {
        const hash = currentRoute.replace('#', '') || '/';

        if (hash === '/' || hash === '') return <HomePage navigate={navigate} />;
        if (hash.startsWith('/catalog/')) {
          const cat = hash.replace('/catalog/', '');
          return <CatalogPage categorySlug={cat} navigate={navigate} />;
        }
        if (hash === '/catalog') return <CatalogPage navigate={navigate} />;
        if (hash.startsWith('/product/')) {
          const id = hash.replace('/product/', '');
          return <ProductPage productId={id} navigate={navigate} />;
        }
        if (hash === '/cart') return <CartPage navigate={navigate} />;
        if (hash === '/checkout') return <CheckoutPage navigate={navigate} />;
        if (hash === '/account') return <AccountPage navigate={navigate} />;

        return <HomePage navigate={navigate} />;
      };

      return (
        <div className="min-h-screen flex flex-col justify-between">
          <div>
            <Header currentRoute={currentRoute} navigate={navigate} />
            <main>{renderRoute()}</main>
          </div>
          <Footer />
          <Toast message={toast} />
        </div>
      );
    };

    // Render Mount Root
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(
      <AppProvider>
        <MainApp />
      </AppProvider>
    );
  </script>
</body>
</html>
